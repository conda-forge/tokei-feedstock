schema_version: 1

context:
  version: "15.0.0"

package:
  name: tokei
  version: ${{ version }}

source:
  url: https://github.com/XAMPPRocky/tokei/archive/v${{ version }}.tar.gz
  sha256: 966da7b9a81ac6cb777b9f159f4c02e5b83a8b8bd30ebf5991007839926b600c

build:
  number: 0
  script: build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - tokei
  - script:
      - tokei && tokei --help

about:
  homepage: https://tokei.rs
  repository: https://github.com/XAMPPRocky/tokei
  documentation: https://github.com/XAMPPRocky/tokei#how-to-use-tokei
  license: MIT
  summary: |
    Tokei is a program that displays statistics about your code. Tokei will show
    the number of files, total lines within those files and code, comments, and
    blanks grouped by language.
  license_file:
    - LICENCE-MIT
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - dbast
